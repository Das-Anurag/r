
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Circular Arrangements</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 15px;
        background: #f4f6f9;
        color: #222;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px #ccc;
    }

    h1, h2 {
        text-align: center;
    }

    input {
        width: 70px;
        padding: 8px;
        margin: 5px;
        font-size: 16px;
    }

    button {
        padding: 10px 16px;
        margin: 10px 5px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: white;
    }

    button:hover {
        background: #0056b3;
    }

    .degree-inputs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 15px 0;
    }

    .degree-box {
        text-align: center;
        padding: 10px;
        background: #eef3ff;
        border-radius: 8px;
    }

    .degree-box label {
        display: block;
        font-weight: bold;
    }

    .message {
        text-align: center;
        font-weight: bold;
        margin: 15px;
    }

    .table-container {
        overflow-x: auto;
        margin: 20px 0;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 600px;
    }

    th, td {
        border: 1px solid #888;
        padding: 10px;
        text-align: center;
    }

    th {
        background: #007bff;
        color: white;
    }

    tr:nth-child(even) {
        background: #f2f2f2;
    }

    .remainder-heading {
        text-align: center;
        margin-top: 30px;
        padding: 10px;
        background: #e6edff;
        border-radius: 6px;
    }

    .empty-message {
        text-align: center;
        color: #777;
        padding: 10px;
    }

    .summary {
        margin-top: 30px;
        padding: 20px;
        background: #eef3ff;
        border-radius: 10px;
        line-height: 1.8;
        overflow-wrap: anywhere;
    }

    .summary p {
        font-size: 17px;
    }

    .approved {
        color: #008000;
        font-size: 24px;
        font-weight: bold;
    }

    .failed {
        color: #cc0000;
        font-size: 24px;
        font-weight: bold;
    }

    .math {
        font-size: 17px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Circular Arrangements</h1>

    <h2>Enter n</h2>

    <div style="text-align:center;">
        <label for="nValue">Value of n:</label>

        <input type="number"
               id="nValue"
               min="1"
               max="9"
               value="3">

        <button onclick="createDegreeInputs()">
            Create Degree Inputs
        </button>
    </div>

    <h2>Degrees</h2>

    <div id="degreeInputs" class="degree-inputs"></div>

    <div class="message" id="degreeSum"></div>

    <div style="text-align:center;">
        <button onclick="generateArrangements()">
            Generate Circular Arrangements
        </button>
    </div>

    <h2>Results</h2>

    <div class="message" id="resultMessage"></div>

    <div id="tablesContainer"></div>

    <div id="summaryContainer"></div>

</div>

<script>

let n = 3;


// Create degree inputs
function createDegreeInputs() {

    n = Number(document.getElementById("nValue").value);

    if (!Number.isInteger(n) || n < 1 || n > 9) {
        alert("Please enter an integer n between 1 and 9.");
        return;
    }

    const container = document.getElementById("degreeInputs");

    container.innerHTML = "";

    for (let c = 1; c <= n; c++) {

        const box = document.createElement("div");

        box.className = "degree-box";

        const label = document.createElement("label");

        label.innerHTML = "θ<sub>" + c + "</sub>";

        const input = document.createElement("input");

        input.type = "number";
        input.min = "0";
        input.max = n;
        input.value = "1";
        input.id = "theta" + c;

        input.addEventListener("input", updateDegreeSum);

        box.appendChild(label);

        box.appendChild(input);

        container.appendChild(box);
    }

    updateDegreeSum();

    document.getElementById("resultMessage").innerHTML = "";

    document.getElementById("tablesContainer").innerHTML = "";

    document.getElementById("summaryContainer").innerHTML = "";
}


// Degree sum
function updateDegreeSum() {

    let sum = 0;

    for (let c = 1; c <= n; c++) {

        const input = document.getElementById("theta" + c);

        if (input) {
            sum += Number(input.value);
        }
    }

    document.getElementById("degreeSum").innerHTML =
        "Degree sum = " + sum +
        " (Required: " + n + ")";
}


// Lexicographical comparison
function compareArrays(a, b) {

    for (let i = 0; i < a.length; i++) {

        if (a[i] < b[i]) return -1;

        if (a[i] > b[i]) return 1;
    }

    return 0;
}


// Canonical circular arrangement
function isCanonical(arr) {

    const len = arr.length;

    for (let shift = 1; shift < len; shift++) {

        const rotated = [];

        for (let i = 0; i < len; i++) {

            rotated.push(arr[(i + shift) % len]);
        }

        if (compareArrays(rotated, arr) < 0) {
            return false;
        }
    }

    return true;
}


// Calculate remainder
function calculateRemainder(arr) {

    let sum = 0;

    for (let k = 0; k < n; k++) {

        sum += (k + 1) * arr[k];
    }

    return sum % n;
}


// Count distinct linear representations
function countLinearRepresentations(arr) {

    const rotations = new Set();

    for (let shift = 0; shift < n; shift++) {

        const rotated = [];

        for (let k = 0; k < n; k++) {

            rotated.push(arr[(k + shift) % n]);
        }

        rotations.add(rotated.join(","));
    }

    return rotations.size;
}


// Factorial
function factorial(num) {

    let result = 1;

    for (let i = 2; i <= num; i++) {

        result *= i;
    }

    return result;
}


// Number of linear arrangements
function calculateLinearArrangements(degrees) {

    let result = factorial(n);

    for (let k = 0; k < n; k++) {

        result /= factorial(degrees[k]);
    }

    return result;
}


// Complex exponential e^(i*angle)
function complexExponential(angle) {

    return {
        real: Math.cos(angle),
        imag: Math.sin(angle)
    };
}


// Actual coefficient of the polynomial monomial
function calculateActualCoefficient(degrees) {

    const remaining = [...degrees];

    const current = [];

    let realSum = 0;

    let imagSum = 0;

    function generate(position) {

        if (position === n) {

            let weightedSum = 0;

            for (let k = 0; k < n; k++) {

                weightedSum += (k + 1) * current[k];
            }

            const angle = 2 * Math.PI * weightedSum / n;

            const value = complexExponential(angle);

            realSum += value.real;

            imagSum += value.imag;

            return;
        }

        for (let c = 0; c < n; c++) {

            if (remaining[c] > 0) {

                remaining[c]--;

                current.push(c + 1);

                generate(position + 1);

                current.pop();

                remaining[c]++;
            }
        }
    }

    generate(0);

    return {
        real: realSum,
        imag: imagSum
    };
}


// Format complex number
function formatComplex(real, imag) {

    const precision = 6;

    real = Number(real.toFixed(precision));

    imag = Number(imag.toFixed(precision));

    if (real === 0) real = 0;

    if (imag === 0) imag = 0;

    if (imag === 0) {
        return String(real);
    }

    if (real === 0) {

        if (imag === 1) return "i";

        if (imag === -1) return "-i";

        return imag + "i";
    }

    if (imag > 0) {

        return real + " + " + imag + "i";
    }

    return real + " - " + Math.abs(imag) + "i";
}


// Generate arrangements
function generateArrangements() {

    n = Number(document.getElementById("nValue").value);

    if (!Number.isInteger(n) || n < 1 || n > 9) {

        alert("Please enter an integer n between 1 and 9.");

        return;
    }

    const degrees = [];

    let sum = 0;

    for (let c = 1; c <= n; c++) {

        const input = document.getElementById("theta" + c);

        if (!input) {

            alert("Please create the degree inputs first.");

            return;
        }

        const value = Number(input.value);

        if (!Number.isInteger(value) || value < 0 || value > n) {

            alert("Each degree must be a whole number between 0 and n.");

            return;
        }

        degrees.push(value);

        sum += value;
    }

    if (sum !== n) {

        alert("The sum of all degrees must equal n.");

        return;
    }

    const groups = Array.from(
        { length: n },
        () => []
    );

    const current = [];

    function generate(position) {

        if (position === n) {

            if (isCanonical(current)) {

                const arrangement = [...current];

                const remainder =
                    calculateRemainder(arrangement);

                const v =
                    countLinearRepresentations(arrangement);

                groups[remainder].push({
                    arrangement: arrangement,
                    remainder: remainder,
                    v: v
                });
            }

            return;
        }

        for (let c = 0; c < n; c++) {

            if (degrees[c] > 0) {

                degrees[c]--;

                current.push(c + 1);

                generate(position + 1);

                current.pop();

                degrees[c]++;
            }
        }
    }

    generate(0);

    displayTables(groups);

    displaySummary(groups, sum, degrees);
}


// Display tables
function displayTables(groups) {

    const container =
        document.getElementById("tablesContainer");

    container.innerHTML = "";

    for (let t = 0; t < n; t++) {

        const heading = document.createElement("h2");

        heading.className = "remainder-heading";

        heading.innerHTML =
            "Table " + (t + 1) +
            " : Remainder = " + t;

        container.appendChild(heading);

        const tableContainer =
            document.createElement("div");

        tableContainer.className = "table-container";

        const table = document.createElement("table");

        const thead = document.createElement("thead");

        const headerRow = document.createElement("tr");

        const th1 = document.createElement("th");

        th1.innerHTML = "Arrangement Name";

        const th2 = document.createElement("th");

        th2.innerHTML = "Circular Arrangement";

        const th3 = document.createElement("th");

        th3.innerHTML =
            "R = (Σ<sub>k=1</sub><sup>n</sup> k c<sub>k</sub>) mod n";

        const th4 = document.createElement("th");

        th4.innerHTML = "v<sub>t,r</sub>";

        headerRow.appendChild(th1);

        headerRow.appendChild(th2);

        headerRow.appendChild(th3);

        headerRow.appendChild(th4);

        thead.appendChild(headerRow);

        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        if (groups[t].length === 0) {

            const row = document.createElement("tr");

            const cell = document.createElement("td");

            cell.colSpan = 4;

            cell.className = "empty-message";

            cell.textContent = "No arrangements";

            row.appendChild(cell);

            tbody.appendChild(row);
        }

        groups[t].forEach((item, index) => {

            const row = document.createElement("tr");

            const r = index + 1;

            // Arrangement name A_(t,r)
            const nameCell = document.createElement("td");

            nameCell.innerHTML =
                "A<sub>" + (t + 1) + "," + r + "</sub>";

            // Circular arrangement
            const arrangementCell = document.createElement("td");

            const symbols = item.arrangement.map(value =>
                "α" + value
            );

            arrangementCell.textContent =
                "[ " + symbols.join(" , ") + " ]";

            // Remainder
            const remainderCell = document.createElement("td");

            remainderCell.textContent = item.remainder;

            // Number of linear representations
            const vCell = document.createElement("td");

            vCell.textContent = item.v;

            row.appendChild(nameCell);

            row.appendChild(arrangementCell);

            row.appendChild(remainderCell);

            row.appendChild(vCell);

            tbody.appendChild(row);
        });

        table.appendChild(tbody);

        tableContainer.appendChild(table);

        container.appendChild(tableContainer);
    }
}


// Display final summary and verification
function displaySummary(groups, degrees) {

    let circularCount = 0;

    let sumV = 0;

    let weightedReal = 0;

    let weightedImag = 0;

    // Calculate Σ u_(t,r) * v_(t,r)
    for (let t = 0; t < n; t++) {

        for (let r = 0; r < groups[t].length; r++) {

            const item = groups[t][r];

            circularCount++;

            sumV += item.v;

            const angle =
                2 * Math.PI * item.remainder / n;

            const u = complexExponential(angle);

            weightedReal += u.real * item.v;

            weightedImag += u.imag * item.v;
        }
    }

    // Number of linear arrangements
    const linearCount =
        calculateLinearArrangements(degrees);

    // Verification
    const verified = (sumV === linearCount);

    // Actual coefficient
    const coefficient =
        calculateActualCoefficient(degrees);

    const weightedSum =
        formatComplex(weightedReal, weightedImag);

    const coefficientResult =
        formatComplex(coefficient.real, coefficient.imag);

    const summary =
        document.getElementById("summaryContainer");

    summary.innerHTML = `
        <div class="summary">

            <h2>Final Summary</h2>

            <p>
                Number of possible circular arrangements:
                ${circularCount}
            </p>

            <p>
                Number of possible linear arrangements:
                ${linearCount}
            </p>

            <p class="math">
                Σ u<sub>t,r</sub> v<sub>t,r</sub> =
                ${weightedSum}
            </p>

            <p>
                Σ v<sub>t,r</sub> =
                ${sumV}
            </p>

            <p>
                Verification:
                ${sumV} = ${linearCount}
            </p>

            <p class="${verified ? "approved" : "failed"}">
                ${verified ? "Approved" : "Something went wrong"}
            </p>

            ${
                verified
                ? `
                <p class="math">
                    Coefficient of
                    ∏<sub>k=1</sub><sup>n</sup>
                    (α<sub>k</sub>)<sup>θ<sub>k</sub></sup>
                    in P(n) =
                    ${coefficientResult}
                </p>
                `
                : ""
            }

        </div>
    `;
}


// Initialize
createDegreeInputs();

</script>

</body>
</html>
