
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Permutation Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f6f9;
        color: #222;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 10px #ccc;
    }

    h2 {
        text-align: center;
        color: #1e3a8a;
    }

    input {
        padding: 8px;
        margin: 5px;
        width: 100px;
        border: 1px solid #aaa;
        border-radius: 5px;
    }

    button {
        padding: 10px 15px;
        margin: 5px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .alpha-input {
        display: inline-block;
        margin: 5px;
        padding: 8px;
        background: #eef2ff;
        border-radius: 5px;
    }

    .result {
        margin-top: 20px;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        min-width: 600px;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
    }

    th {
        background: #dbeafe;
    }

    .expression {
        text-align: left;
        word-break: break-word;
    }

    .note {
        color: #555;
        font-size: 14px;
    }

    .sum-box {
        margin-top: 25px;
        padding: 15px;
        background: #eef2ff;
        border-radius: 8px;
        overflow-wrap: anywhere;
    }

    .sum-box h3 {
        color: #1e3a8a;
    }

    .table-title {
        color: #1e3a8a;
        margin-top: 25px;
    }
</style>
</head>

<body>

<div class="container">

<h2>Alpha Permutation Calculator</h2>

<label><b>Enter n:</b></label>
<input type="number" id="n" min="1" max="9" value="4">

<button onclick="generateInputs()">Generate Alpha Inputs</button>

<p class="note">
Enter the values of α(1), α(2), ..., α(n).
The values will be sorted in ascending order automatically.
</p>

<div id="alphaInputs"></div>

<br>

<button onclick="calculate()">Generate All Tables</button>

<div class="result" id="results"></div>

</div>

<script>

function generateInputs() {
    const n = parseInt(document.getElementById("n").value);
    const container = document.getElementById("alphaInputs");

    container.innerHTML = "";
    document.getElementById("results").innerHTML = "";

    if (!Number.isInteger(n) || n < 1 || n > 9) {
        alert("Please enter n between 1 and 9.");
        return;
    }

    for (let c = 1; c <= n; c++) {
        const div = document.createElement("div");
        div.className = "alpha-input";

        div.innerHTML = `
            <label>α(${c}) = </label>
            <input type="number" step="any" id="alpha${c}" value="${c}">
        `;

        container.appendChild(div);
    }
}


// Factorial function
function factorial(n) {
    let result = 1;

    for (let i = 2; i <= n; i++) {
        result *= i;
    }

    return result;
}


// Generate all permutations of an array
function generatePermutations(arr) {
    let permutations = [];

    function permute(current, remaining) {
        if (remaining.length === 0) {
            permutations.push([...current]);
            return;
        }

        for (let i = 0; i < remaining.length; i++) {
            let next = remaining[i];

            let newRemaining = remaining.filter((_, index) => index !== i);

            permute([...current, next], newRemaining);
        }
    }

    permute([], arr);

    return permutations;
}


// Calculate

function calculate() {

    const n = parseInt(document.getElementById("n").value);

    if (!Number.isInteger(n) || n < 1 || n > 9) {
        alert("Please enter n between 1 and 9.");
        return;
    }

    let alpha = [];

    for (let c = 1; c <= n; c++) {

        const input = document.getElementById("alpha" + c);

        if (!input || input.value === "") {
            alert("Please enter all alpha values.");
            return;
        }

        const value = Number(input.value);

        if (!Number.isFinite(value)) {
            alert("Invalid alpha value.");
            return;
        }

        alpha.push(value);
    }

    // Sort alpha values in ascending order
    alpha.sort((a, b) => a - b);


    // Generate permutations
    function generatePermutations(arr) {

        let permutations = [];

        function permute(current, remaining) {

            if (remaining.length === 0) {
                permutations.push([...current]);
                return;
            }

            for (let i = 0; i < remaining.length; i++) {

                let next = remaining[i];

                let newRemaining =
                    remaining.filter((_, index) => index !== i);

                permute([...current, next], newRemaining);
            }
        }

        permute([], arr);

        return permutations;
    }


    // Generate cyclic arrangements
    let arrangements = [];

    if (n === 1) {

        arrangements = [[0]];

    } else {

        let remainingDigits = [];

        for (let digit = 3; digit <= n; digit++) {
            remainingDigits.push(digit);
        }

        let tailPermutations =
            generatePermutations(remainingDigits);

        if (n === 2) {
            tailPermutations = [[]];
        }

        tailPermutations.forEach(tail => {

            let cyclicSequence = [2, ...tail];

            for (let shift = 0; shift < n - 1; shift++) {

                let rotated = cyclicSequence.slice(shift)
                    .concat(cyclicSequence.slice(0, shift));

                let permutation = [1, ...rotated];

                arrangements.push(
                    permutation.map(x => x - 1)
                );
            }

        });

    }


    // Create exactly n tables.
    // Table 1 -> remainder 0
    // Table 2 -> remainder 1
    // ...
    // Table n -> remainder n-1

    let tables = Array.from({ length: n }, () => []);


    // Initialize complex summation
    let realSum = 0;
    let imaginarySum = 0;


    // Calculate A(r) and group by remainder
    arrangements.forEach((p, index) => {

        let expression = [];
        let sum = 0;

        for (let c = 0; c < n; c++) {

            let coefficient = c + 1;
            let value = alpha[p[c]];

            sum += coefficient * value;

            if (coefficient === 1) {

                expression.push(`α(${p[c] + 1})`);

            } else {

                expression.push(
                    `${coefficient}α(${p[c] + 1})`
                );

            }
        }


        // Calculate non-negative remainder
        let remainder = ((sum % n) + n) % n;


        // Group the row into the appropriate table
        let tableIndex = remainder;

        tables[tableIndex].push({

            number: index + 1,

            permutation: p.map(x => x + 1).join(""),

            expression: expression.join(" + "),

            calculatedValue: sum,

            remainder: remainder

        });


        // Calculate exponential
        let angle = (2 * Math.PI * remainder) / n;

        realSum += Math.cos(angle);

        imaginarySum += Math.sin(angle);

    });


    // Display tables
    let html = `

        <h3>Total Tables: ${n}</h3>

        <h3>Total Data Rows: ${arrangements.length}</h3>

        <p>
        <b>Sorted Alpha Values:</b>
        ${alpha.map((v, i) =>
            `α(${i + 1}) = ${v}`
        ).join(", ")}
        </p>

    `;


    tables.forEach((table, tableIndex) => {

        html += `

            <h3 class="table-title">
                Table ${tableIndex + 1}
                (Remainder = ${tableIndex})
            </h3>

            <table>

                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Permutation</th>
                        <th>Expression</th>
                        <th>Calculated Value A(r)</th>
                        <th>Remainder A(r) ÷ n</th>
                    </tr>
                </thead>

                <tbody>

        `;


        table.forEach(row => {

            html += `

                <tr>

                    <td>A(${row.number})</td>

                    <td>${row.permutation}</td>

                    <td class="expression">
                        ${row.expression}
                    </td>

                    <td>${row.calculatedValue}</td>

                    <td>${row.remainder}</td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;

    });


    // Remove tiny floating-point errors
    function cleanNumber(value) {

        if (Math.abs(value) < 1e-10) {
            return 0;
        }

        return Number(value.toFixed(10));

    }


    realSum = cleanNumber(realSum);

    imaginarySum = cleanNumber(imaginarySum);


    // Display final complex summation
    html += `

        <div class="sum-box">

            <h3>Final Complex Summation</h3>

            <p>

            <b>
            S<sub>n</sub> =
            Σ<sub>r=1</sub><sup>(n−1)!</sup>
            e<sup>
            i2π remainder(A(r) ÷ n)/n
            </sup>
            </b>

            </p>

            <p>
            <b>Rectangular Form:</b>
            </p>

            <p>

            S<sub>n</sub> =

            ${realSum}

            ${imaginarySum >= 0 ? "+" : "-"}

            ${Math.abs(imaginarySum)}i

            </p>

        </div>

    `;


    document.getElementById("results").innerHTML = html;

}


// Generate default inputs for n = 4
generateInputs();

</script>

</body>
</html>
