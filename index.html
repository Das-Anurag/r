
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Circular Arrangements and Coefficient Calculation</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 15px;
        background: #f4f6f9;
        color: #222;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px #ccc;
    }

    h1, h2 {
        text-align: center;
    }

    input {
        width: 70px;
        padding: 8px;
        margin: 5px;
        font-size: 16px;
    }

    button {
        padding: 10px 16px;
        margin: 10px 5px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: white;
    }

    button:hover {
        background: #0056b3;
    }

    .degree-inputs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 15px 0;
    }

    .degree-box {
        text-align: center;
        padding: 10px;
        background: #eef3ff;
        border-radius: 8px;
    }

    .degree-box label {
        display: block;
        font-weight: bold;
    }

    .message {
        text-align: center;
        font-weight: bold;
        margin: 15px;
    }

    .table-container {
        overflow-x: auto;
        margin: 20px 0;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 600px;
    }

    th, td {
        border: 1px solid #888;
        padding: 10px;
        text-align: center;
    }

    th {
        background: #007bff;
        color: white;
    }

    tr:nth-child(even) {
        background: #f2f2f2;
    }

    .remainder-heading {
        text-align: center;
        margin-top: 30px;
        padding: 10px;
        background: #e6edff;
        border-radius: 6px;
    }

    .empty-message {
        text-align: center;
        color: #777;
        padding: 10px;
    }

    .summary {
        margin-top: 30px;
        padding: 20px;
        background: #eef3ff;
        border-radius: 10px;
        line-height: 1.8;
        overflow-wrap: anywhere;
    }

    .summary p {
        font-size: 17px;
    }

    .approved {
        color: #087a32;
        font-weight: bold;
        font-size: 22px;
        text-align: center;
    }

    .failed {
        color: #c00000;
        font-weight: bold;
        font-size: 22px;
        text-align: center;
    }

    .equation {
        text-align: center;
        font-size: 18px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Circular Arrangements</h1>

    <h2>Enter n</h2>

    <div style="text-align:center;">
        <label for="nValue">Value of n:</label>

        <input type="number"
               id="nValue"
               min="1"
               max="9"
               value="3">

        <button onclick="createDegreeInputs()">
            Create Degree Inputs
        </button>
    </div>

    <h2>Degrees</h2>

    <div id="degreeInputs" class="degree-inputs"></div>

    <div class="message" id="degreeSum"></div>

    <div style="text-align:center;">
        <button onclick="generateArrangements()">
            Generate Circular Arrangements
        </button>
    </div>

    <h2>Results</h2>

    <div class="message" id="resultMessage"></div>

    <div id="tablesContainer"></div>

    <div id="summaryContainer"></div>

</div>

<script>

let n = 3;


// Create degree inputs
function createDegreeInputs() {

    n = Number(document.getElementById("nValue").value);

    if (!Number.isInteger(n) || n < 1 || n > 9) {
        alert("Please enter an integer n between 1 and 9.");
        return;
    }

    const container = document.getElementById("degreeInputs");

    container.innerHTML = "";

    for (let c = 1; c <= n; c++) {

        const box = document.createElement("div");

        box.className = "degree-box";

        const label = document.createElement("label");

        label.innerHTML = "θ<sub>" + c + "</sub>";

        const input = document.createElement("input");

        input.type = "number";
        input.min = "0";
        input.max = n;
        input.value = "1";
        input.id = "theta" + c;

        input.addEventListener("input", updateDegreeSum);

        box.appendChild(label);

        box.appendChild(input);

        container.appendChild(box);
    }

    updateDegreeSum();

    document.getElementById("resultMessage").innerHTML = "";

    document.getElementById("tablesContainer").innerHTML = "";

    document.getElementById("summaryContainer").innerHTML = "";
}


// Calculate degree sum
function updateDegreeSum() {

    let sum = 0;

    for (let c = 1; c <= n; c++) {

        const input = document.getElementById("theta" + c);

        if (input) {
            sum += Number(input.value);
        }
    }

    document.getElementById("degreeSum").innerHTML =
        "Degree sum = " + sum +
        " (Required: " + n + ")";
}


// Lexicographical comparison
function compareArrays(a, b) {

    for (let i = 0; i < a.length; i++) {

        if (a[i] < b[i]) return -1;

        if (a[i] > b[i]) return 1;
    }

    return 0;
}


// Check whether arrangement is the smallest among rotations
function isCanonical(arr) {

    const len = arr.length;

    for (let shift = 1; shift < len; shift++) {

        const rotated = [];

        for (let i = 0; i < len; i++) {

            rotated.push(arr[(i + shift) % len]);
        }

        if (compareArrays(rotated, arr) < 0) {
            return false;
        }
    }

    return true;
}


// Calculate remainder
function calculateRemainder(arr) {

    let sum = 0;

    for (let k = 0; k < n; k++) {

        sum += (k + 1) * arr[k];
    }

    return sum % n;
}


// Count distinct linear sequence representations
// of a circular arrangement
function countLinearRepresentations(arr) {

    const rotations = new Set();

    for (let shift = 0; shift < n; shift++) {

        const rotated = [];

        for (let k = 0; k < n; k++) {

            rotated.push(arr[(k + shift) % n]);
        }

        rotations.add(rotated.join(","));
    }

    return rotations.size;
}


// Calculate factorial
function factorial(num) {

    let result = 1;

    for (let i = 2; i <= num; i++) {

        result *= i;
    }

    return result;
}


// Calculate number of linear arrangements
function calculateLinearArrangements(degrees) {

    let result = factorial(n);

    for (let k = 0; k < n; k++) {

        result /= factorial(degrees[k]);
    }

    return result;
}


// Format complex number
function formatComplex(real, imag) {

    // Remove insignificant floating-point noise
    if (Math.abs(real) < 1e-10) real = 0;

    if (Math.abs(imag) < 1e-10) imag = 0;

    real = Number(real.toFixed(10));

    imag = Number(imag.toFixed(10));

    if (imag === 0) {
        return String(real);
    }

    if (real === 0) {
        return imag + "i";
    }

    if (imag > 0) {
        return real + " + " + imag + "i";
    }

    return real + " - " + Math.abs(imag) + "i";
}


// Generate circular arrangements
function generateArrangements() {

    n = Number(document.getElementById("nValue").value);

    if (!Number.isInteger(n) || n < 1 || n > 9) {

        alert("Please enter an integer n between 1 and 9.");

        return;
    }

    const degrees = [];

    let sum = 0;

    for (let c = 1; c <= n; c++) {

        const input = document.getElementById("theta" + c);

        if (!input) {

            alert("Please create the degree inputs first.");

            return;
        }

        const value = Number(input.value);

        if (!Number.isInteger(value) || value < 0 || value > n) {

            alert("Each degree must be a whole number between 0 and n.");

            return;
        }

        degrees.push(value);

        sum += value;
    }

    if (sum !== n) {

        alert("The sum of all degrees must equal n.");

        return;
    }

    // n groups: remainders 0, 1, ..., n-1
    const groups = Array.from(
        { length: n },
        () => []
    );

    const current = [];

    // Generate multiset permutations
    function generate(position) {

        if (position === n) {

            if (isCanonical(current)) {

                const arrangement = [...current];

                const remainder =
                    calculateRemainder(arrangement);

                const linearRepresentations =
                    countLinearRepresentations(arrangement);

                groups[remainder].push({
                    arrangement: arrangement,
                    remainder: remainder,
                    linearRepresentations: linearRepresentations
                });
            }

            return;
        }

        for (let c = 0; c < n; c++) {

            if (degrees[c] > 0) {

                degrees[c]--;

                current.push(c + 1);

                generate(position + 1);

                current.pop();

                degrees[c]++;
            }
        }
    }

    generate(0);

    displayTables(groups);

    displaySummary(groups, sum);
}


// Display all remainder tables
function displayTables(groups) {

    const container =
        document.getElementById("tablesContainer");

    container.innerHTML = "";

    let totalCircular = 0;

    for (let t = 0; t < n; t++) {

        totalCircular += groups[t].length;

        const heading = document.createElement("h2");

        heading.className = "remainder-heading";

        heading.innerHTML =
            "Table " + (t + 1) +
            " : Remainder = " + t;

        container.appendChild(heading);

        const tableContainer =
            document.createElement("div");

        tableContainer.className = "table-container";

        const table = document.createElement("table");

        // Table heading
        const thead = document.createElement("thead");

        const headerRow = document.createElement("tr");

        const th1 = document.createElement("th");

        th1.innerHTML = "Arrangement Name";

        const th2 = document.createElement("th");

        th2.innerHTML = "Circular Arrangement";

        const th3 = document.createElement("th");

        th3.innerHTML =
            "Remainder " +
            "<br>" +
            "(Σ<sub>k=1</sub><sup>n</sup> k c<sub>k</sub>) mod n";

        const th4 = document.createElement("th");

        th4.innerHTML =
            "Number of Linear Representations " +
            "<br>" +
            "(v<sub>t,r</sub>)";

        headerRow.appendChild(th1);

        headerRow.appendChild(th2);

        headerRow.appendChild(th3);

        headerRow.appendChild(th4);

        thead.appendChild(headerRow);

        table.appendChild(thead);

        // Table body
        const tbody = document.createElement("tbody");

        if (groups[t].length === 0) {

            const row = document.createElement("tr");

            const cell = document.createElement("td");

            cell.colSpan = 4;

            cell.className = "empty-message";

            cell.textContent = "No arrangements";

            row.appendChild(cell);

            tbody.appendChild(row);
        }

        groups[t].forEach((item, index) => {

            const row = document.createElement("tr");

            // Arrangement name A_(t,r)
            const nameCell = document.createElement("td");

            nameCell.innerHTML =
                "A<sub>" + (t + 1) + "," + (index + 1) + "</sub>";

            // Circular arrangement
            const arrangementCell = document.createElement("td");

            const symbols = item.arrangement.map(value =>
                "α" + value
            );

            arrangementCell.textContent =
                "[ " + symbols.join(" , ") + " ]";

            // Remainder
            const remainderCell = document.createElement("td");

            remainderCell.textContent = item.remainder;

            // Number of linear representations
            const representationCell = document.createElement("td");

            representationCell.textContent =
                item.linearRepresentations;

            row.appendChild(nameCell);

            row.appendChild(arrangementCell);

            row.appendChild(remainderCell);

            row.appendChild(representationCell);

            tbody.appendChild(row);
        });

        table.appendChild(tbody);

        tableContainer.appendChild(table);

        container.appendChild(tableContainer);
    }

    document.getElementById("resultMessage").innerHTML =
        "Tables generated successfully.";
}


// Calculate and display final summary
function displaySummary(groups, degrees) {

    let circularCount = 0;

    let sumV = 0;

    let coefficientReal = 0;

    let coefficientImag = 0;

    for (let t = 0; t < n; t++) {

        for (let r = 0; r < groups[t].length; r++) {

            const item = groups[t][r];

            circularCount++;

            const v = item.linearRepresentations;

            const remainder = item.remainder;

            sumV += v;

            // u = exp(i * 2π * remainder / n)
            const angle =
                (2 * Math.PI * remainder) / n;

            const uReal = Math.cos(angle);

            const uImag = Math.sin(angle);

            // u*v
            coefficientReal += uReal * v;

            coefficientImag += uImag * v;
        }
    }

    // Multinomial coefficient
    const linearCount =
        calculateLinearArrangements(degrees);

    // Verification
    const verification =
        (sumV === linearCount);

    const coefficient =
        formatComplex(
            coefficientReal,
            coefficientImag
        );

    const summary =
        document.getElementById("summaryContainer");

    let html = `
        <div class="summary">

            <h2>Final Summary</h2>

            <p>
                Number of possible circular arrangements:
                <strong>${circularCount}</strong>
            </p>

            <p>
                Number of possible linear arrangements:
                <strong>${linearCount}</strong>
            </p>

            <p>
                Σ v<sub>t,r</sub> =
                <strong>${sumV}</strong>
            </p>

            <p>
                Verification:
                Σ v<sub>t,r</sub> =
                n! / Π θ<sub>k</sub>! =
                ${sumV} / ${linearCount}
            </p>

            <p class="${verification ? 'approved' : 'failed'}">
                ${verification ? "APPROVED" : "SOMETHING WENT WRONG"}
            </p>

            <hr>

            <p class="equation">
                Σ u<sub>t,r</sub> v<sub>t,r</sub>
                =
                ${coefficient}
            </p>

            <p>
                where
                u<sub>t,r</sub> =
                e<sup>i(2π/n)R<sub>t,r</sub></sup>
            </p>
    `;

    if (verification) {

        html += `
            <p class="approved">
                Approved
            </p>

            <p class="equation">
                Coefficient of
                Π<sub>k=1</sub><sup>n</sup>
                (α<sub>k</sub>)<sup>θ<sub>k</sub></sup>
                is:
            </p>

            <p class="equation">
                ${coefficient}
            </p>
        `;
    } else {

        html += `
            <p class="failed">
                Something went wrong.
            </p>
        `;
    }

    html += `
        </div>
    `;

    summary.innerHTML = html;
}


// Initialize
createDegreeInputs();

</script>

</body>
</html>
