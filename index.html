
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Circular Arrangements</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f6f9;
        color: #222;
    }

    h1, h2 {
        text-align: center;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px #ccc;
    }

    input {
        width: 70px;
        padding: 8px;
        margin: 5px;
        font-size: 16px;
    }

    button {
        padding: 10px 16px;
        margin: 10px 5px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: white;
    }

    button:hover {
        background: #0056b3;
    }

    .degree-inputs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 15px 0;
    }

    .degree-box {
        text-align: center;
        padding: 10px;
        background: #eef3ff;
        border-radius: 8px;
    }

    .degree-box label {
        display: block;
        font-weight: bold;
    }

    .message {
        text-align: center;
        font-weight: bold;
        margin: 15px;
    }

    .table-container {
        overflow-x: auto;
        margin-top: 20px;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 500px;
    }

    th, td {
        border: 1px solid #888;
        padding: 10px;
        text-align: center;
        white-space: nowrap;
    }

    th {
        background: #007bff;
        color: white;
    }

    tr:nth-child(even) {
        background: #f2f2f2;
    }

    .formula {
        text-align: center;
        font-size: 18px;
        margin: 15px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Circular Arrangements</h1>

    <div class="formula">
        <p>Σ θ<sub>k</sub> = n</p>
        <p>0 ≤ θ<sub>k</sub> ≤ n</p>
    </div>

    <h2>Step 1: Enter n</h2>

    <div style="text-align:center;">
        <label for="nValue">Value of n:</label>
        <input type="number" id="nValue" min="1" max="9" value="3">

        <button onclick="createDegreeInputs()">
            Create Degree Inputs
        </button>
    </div>

    <h2>Step 2: Enter Degrees</h2>

    <div id="degreeInputs" class="degree-inputs"></div>

    <div class="message" id="degreeSum"></div>

    <div style="text-align:center;">
        <button onclick="generateArrangements()">
            Generate Circular Arrangements
        </button>
    </div>

    <h2>Step 3: Result</h2>

    <div class="message" id="resultMessage"></div>

    <div class="table-container">
        <table id="resultTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>

let n = 3;

// Create inputs for θ1, θ2, ..., θn
function createDegreeInputs() {

    n = Number(document.getElementById("nValue").value);

    if (!Number.isInteger(n) || n < 1 || n > 9) {
        alert("Please enter an integer n between 1 and 9.");
        return;
    }

    const container = document.getElementById("degreeInputs");

    container.innerHTML = "";

    for (let k = 1; k <= n; k++) {

        const box = document.createElement("div");
        box.className = "degree-box";

        const label = document.createElement("label");

        label.innerHTML = "θ<sub>" + k + "</sub>";

        const input = document.createElement("input");

        input.type = "number";
        input.min = "0";
        input.max = n;
        input.value = "0";
        input.id = "theta" + k;

        input.addEventListener("input", updateDegreeSum);

        box.appendChild(label);
        box.appendChild(input);

        container.appendChild(box);
    }

    updateDegreeSum();

    document.getElementById("resultMessage").innerHTML = "";

    document.querySelector("#resultTable thead").innerHTML = "";
    document.querySelector("#resultTable tbody").innerHTML = "";
}


// Calculate the sum of degrees
function updateDegreeSum() {

    let sum = 0;

    for (let k = 1; k <= n; k++) {

        const input = document.getElementById("theta" + k);

        if (input) {
            sum += Number(input.value);
        }
    }

    document.getElementById("degreeSum").innerHTML =
        "Σ θ<sub>k</sub> = " + sum + " (Required: " + n + ")";
}


// Compare two arrangements lexicographically
function compareArrays(a, b) {

    for (let i = 0; i < a.length; i++) {

        if (a[i] < b[i]) return -1;

        if (a[i] > b[i]) return 1;
    }

    return 0;
}


// Check whether an arrangement is the smallest
// among all its rotations
function isCanonical(arr) {

    const len = arr.length;

    for (let shift = 1; shift < len; shift++) {

        const rotated = [];

        for (let i = 0; i < len; i++) {

            rotated.push(arr[(i + shift) % len]);
        }

        if (compareArrays(rotated, arr) < 0) {
            return false;
        }
    }

    return true;
}


// Generate all distinct circular arrangements
function generateArrangements() {

    n = Number(document.getElementById("nValue").value);

    if (!Number.isInteger(n) || n < 1 || n > 9) {
        alert("Please enter an integer n between 1 and 9.");
        return;
    }

    const degrees = [];

    let sum = 0;

    for (let k = 1; k <= n; k++) {

        const input = document.getElementById("theta" + k);

        if (!input) {
            alert("Please create the degree inputs first.");
            return;
        }

        const value = Number(input.value);

        if (!Number.isInteger(value) || value < 0 || value > n) {

            alert("Each degree must be a whole number between 0 and n.");
            return;
        }

        degrees.push(value);

        sum += value;
    }

    if (sum !== n) {

        alert("The sum of all degrees must be equal to n.");

        return;
    }

    const arrangements = [];

    const current = [];

    // Recursive generation of multiset permutations
    function generate(position) {

        if (position === n) {

            if (isCanonical(current)) {

                arrangements.push([...current]);
            }

            return;
        }

        for (let k = 0; k < n; k++) {

            if (degrees[k] > 0) {

                degrees[k]--;

                current.push(k + 1);

                generate(position + 1);

                current.pop();

                degrees[k]++;
            }
        }
    }

    generate(0);

    displayTable(arrangements);

}


// Display the arrangements in a table
function displayTable(arrangements) {

    const tableHead = document.querySelector("#resultTable thead");

    const tableBody = document.querySelector("#resultTable tbody");

    tableHead.innerHTML = "";

    tableBody.innerHTML = "";

    // Table heading
    const headerRow = document.createElement("tr");

    const serialHeader = document.createElement("th");

    serialHeader.textContent = "No.";

    headerRow.appendChild(serialHeader);

    for (let k = 1; k <= n; k++) {

        const th = document.createElement("th");

        th.innerHTML = "α<sub>c</sub>";

        headerRow.appendChild(th);
    }

    tableHead.appendChild(headerRow);

    // Table data
    arrangements.forEach((arr, index) => {

        const row = document.createElement("tr");

        const serialCell = document.createElement("td");

        serialCell.textContent = index + 1;

        row.appendChild(serialCell);

        arr.forEach(value => {

            const cell = document.createElement("td");

            cell.innerHTML = "α<sub>" + value + "</sub>";

            row.appendChild(cell);
        });

        tableBody.appendChild(row);
    });

    document.getElementById("resultMessage").innerHTML =
        "Total distinct circular arrangements = " +
        arrangements.length;
}


// Initialize with n = 3
createDegreeInputs();

</script>

</body>
</html>
